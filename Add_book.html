{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Book - CosmosLib Admin</title>
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <script src="{% static 'js/auth.js' %}"></script>

<body class="dashboard-body">

    <div class="dashboard-container">

        <nav class="top-nav-glass">
            <div class="nav-brand">
                CosmosLib
            </div>
            <div class="nav-links">
                <a href="{% url 'dashboard' %}">Overview</a>
                <a href="{% url 'manage_books' %}">Manage Books</a>
                <a href="{% url 'manage_users' %}">Manage Users</a>
                <a href="{% url 'add_book' %}" class="active">Add Book</a>
                <a href="{% url 'books' %}" target="_blank" style="color: var(--primary);">View Public Site</a>
            </div>
            <div class="topbar-right" style="display:flex; align-items:center;">
            </div>
        </nav>

        <main>
            <div class="page-header">
                <div>
                    <h1>Add New Book</h1>
                    <p>Register a new book into the library system.</p>
                </div>
            </div>

            <div class="form-container">
                <form id="add-book-form">


                    <div class="form-layout">


                        <div class="form-left">

                            <div class="form-group">
                                <label for="book-title">Book Title</label>
                                <input type="text" id="book-title" required placeholder="e.g. The Great Gatsby">
                            </div>

                            <div class="form-group">
                                <label for="book-author">Author Name</label>
                                <input type="text" id="book-author" required placeholder="e.g. F. Scott Fitzgerald">
                            </div>

                            <div class="form-group">
                                <label for="book-category">Category</label>
                                <select id="book-category" required>
                                    <option value="">-- Select Category --</option>
                                    <option value="Romantic">Romantic</option>
                                    <option value="Historic">Historic</option>
                                    <option value="Programming">Programming</option>
                                    <option value="Religious">Religious</option>
                                    <option value="General">General Fiction</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="book-year">Publication Year</label>
                                <input type="number" id="book-year" required placeholder="e.g. 1925">
                            </div>

                            <div class="form-group">
                                <label for="book-pages">Pages</label>
                                <input type="number" id="book-pages" placeholder="e.g. 300">
                            </div>

                            <div class="form-group">
                                <label for="book-language">Language</label>
                                <input type="text" id="book-language" placeholder="e.g. English">
                            </div>

                            <div class="form-group">
                                <label for="book-price">Price ($)</label>
                                <input type="number" id="book-price" step="0.01" placeholder="e.g. 15.99">
                            </div>

                            <div class="form-group" style="grid-column: 1 / -1;">
                                <label for="book-description">Description</label>
                                <textarea id="book-description" rows="3"
                                    placeholder="Brief book description..."></textarea>
                            </div>

                            <div class="form-group">
                                <label for="book-status">Initial Status</label>
                                <select id="book-status">
                                    <option value="Available">Available</option>
                                    <option value="Borrowed">Borrowed</option>
                                </select>
                            </div>

                        </div>


                        <div class="form-right" style="display: flex; flex-direction: column; gap: 20px;">
                            <div class="form-group">
                                <label>Book Cover Image</label>

                                <div class="cover-upload-container"
                                    onclick="document.getElementById('book-cover').click()">

                                    <div class="cover-upload-placeholder" id="cover-upload-placeholder">
                                        <span>Upload Cover</span>
                                    </div>

                                    <img id="cover-preview" class="cover-preview" src="" alt="Cover Preview"
                                        style="display: none;">

                                    <input type="file" id="book-cover" accept="image/*" style="display: none;">
                                </div>
                            </div>
                            
                            <div class="form-group" style="margin-top: 20px;">
                                <label>Book PDF</label>

                                <div class="cover-upload-container"
                                    onclick="document.getElementById('book-pdf').click()" style="height: 100px; display: flex; align-items: center; justify-content: center; cursor: pointer;">

                                    <div class="cover-upload-placeholder" id="pdf-upload-placeholder">
                                        <span>Upload PDF</span>
                                    </div>

                                    <div id="pdf-preview" style="display: none; width: 100%; height: 100%; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); border-radius: 8px;">
                                        <span id="pdf-filename" style="color: white; font-weight: 500; font-size: 0.9rem; text-align: center; word-break: break-all; padding: 0 10px;"></span>
                                    </div>

                                    <input type="file" id="book-pdf" accept="application/pdf" style="display: none;">
                                </div>
                            </div>
                        </div>

                    </div>

                    <button type="submit" class="btn-submit">Save Book to Library</button>

                    <a href="{% url 'manage_books' %}"
                        style="display:block; text-align:center; margin-top:15px; color:var(--text-muted); text-decoration:none;">
                        Cancel and return
                    </a>

                </form>
            </div>

        </main>
    </div>

    <script>
        if (typeof Auth !== 'undefined' && !Auth.requireAdmin()) {
            document.body.innerHTML = '';
        }

        document.getElementById('add-book-form').addEventListener('submit', async function (e) {
            e.preventDefault();

            const title = document.getElementById('book-title').value;
            const author = document.getElementById('book-author').value;
            const category = document.getElementById('book-category').value;
            const status = document.getElementById('book-status').value;
            const year = document.getElementById('book-year').value;
            const pages = document.getElementById('book-pages').value;
            const language = document.getElementById('book-language').value;
            const price = document.getElementById('book-price').value;
            const description = document.getElementById('book-description').value;
            const coverInput = document.getElementById('book-cover');
            const pdfInput = document.getElementById('book-pdf');

            const saveAndRedirect = async (imageUrl, pdfUrl) => {
                try {
                    const res = await Auth.apiFetch('/books/', {
                        method: 'POST',
                        body: JSON.stringify({
                            title, author, category, status, image: imageUrl || "",
                            year: year ? parseInt(year) : null,
                            pages: pages ? parseInt(pages) : null,
                            language,
                            price: price ? parseFloat(price) : null,
                            description,
                            pdf: pdfUrl || ""
                        })
                    });
                    if (res.ok) {
                        alert('Book added successfully!');
                        window.location.href = "{% url 'manage_books' %}";
                    } else {
                        alert('Failed to add book.');
                    }
                } catch(err) {
                    alert('Error adding book.');
                }
            };

            let imageUrl = "";
            let pdfUrl = "";

            const processPdf = () => {
                if (pdfInput && pdfInput.files && pdfInput.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        pdfUrl = event.target.result;
                        saveAndRedirect(imageUrl, pdfUrl);
                    };
                    reader.readAsDataURL(pdfInput.files[0]);
                } else {
                    saveAndRedirect(imageUrl, "");
                }
            };

            if (coverInput.files && coverInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function (event) {
                    imageUrl = event.target.result;
                    processPdf();
                };
                reader.readAsDataURL(coverInput.files[0]);
            } else {
                processPdf();
            }
        });


        document.getElementById('book-cover').addEventListener('change', function () {
            if (this.files && this.files[0]) {
                const reader = new FileReader();
                reader.onload = function (event) {
                    const preview = document.getElementById('cover-preview');
                    preview.src = event.target.result;
                    preview.style.display = 'block';
                    document.getElementById('cover-upload-placeholder').style.display = 'none';
                };
                reader.readAsDataURL(this.files[0]);
            }
        });

        document.getElementById('book-pdf').addEventListener('change', function () {
            if (this.files && this.files[0]) {
                const preview = document.getElementById('pdf-preview');
                const placeholder = document.getElementById('pdf-upload-placeholder');
                const filenameSpan = document.getElementById('pdf-filename');
                
                filenameSpan.textContent = this.files[0].name;
                preview.style.display = 'flex';
                placeholder.style.display = 'none';
            }
        });
    </script>

</body>

</html>

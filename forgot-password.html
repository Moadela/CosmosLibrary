{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - Online Library</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">
  </head>
  <body>
    <!-- Background gradient -->
    <div class="bg-wrapper"></div>

    <!-- Navigation -->
    <nav class="top-nav-glass">
      <a class="nav-brand" href="{% url 'index' %}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        CosmosLib
      </a>
      <a href="{% url 'index' %}" class="nav-home"><i class="fas fa-home"></i> Home</a>
    </nav>

    <!-- Forgot Password Form -->
    <div class="container-forgot-pass">
      <h2><i class="fas fa-lock"></i> Reset Password</h2>
      <p>Enter your email address and we'll send you a link to reset your password.</p>
<form id="forgot-password-form">

  <div class="form-group">
    <label for="reset_email">
      <i class="fas fa-envelope"></i>
      Email Address
    </label>

    <input
      type="email"
      id="reset_email"
      placeholder="email@example.com"
      required
    />
  </div>

  <button type="submit" class="btn">
    <i class="fas fa-paper-plane"></i>
    Send Reset Link
  </button>

</form>
<script>

function showToast(message, type) {

  let container = document.getElementById('toast-container');

  if (!container) {

    container = document.createElement('div');

    container.id = 'toast-container';

    container.className = 'toast-container';

    document.body.appendChild(container);
  }

  const toast = document.createElement('div');

  toast.className = `toast toast-${type}`;

  toast.innerHTML = `
    <i class="fas fa-${
      type === 'success'
        ? 'check-circle'
        : 'times-circle'
    }"></i>

    <span>${message}</span>
  `;

  container.appendChild(toast);

  setTimeout(() => {

    toast.classList.add('toast-out');

    setTimeout(() => {

      toast.remove();

    }, 300);

  }, 3000);
}

document
  .getElementById('forgot-password-form')
  .addEventListener('submit', async function(e) {

    e.preventDefault();

    const email = document
      .getElementById('reset_email')
      .value;

    try {

      const response = await fetch(
        '/api/auth/forgot-password/',
        {
          method: 'POST',

          headers: {
            'Content-Type': 'application/json'
          },

          body: JSON.stringify({
            email: email
          })
        }
      );

      const data = await response.json();

      if (data.success) {

        showToast(
          'Reset link sent successfully!',
          'success'
        );

      } else {

        showToast(
          data.message,
          'error'
        );
      }

    } catch (error) {

      showToast(
        'Server Error',
        'error'
      );
    }
});

</script>
      <div class="back-link">
        <a href="{% url 'login_page' %}"><i class="fas fa-arrow-left"></i> Back to Login</a>
      </div>
    </div>
  </body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Details - CosmosLib</title>
    <link rel="stylesheet" href="{% static 'css/shared-nav.css' %}">
    <link rel="stylesheet" href="{% static 'css/details.css' %}">
    <script src="{% static 'js/auth.js' %}"></script>
</head>

<body>
    <nav class="top-nav-glass"
        style="margin: 30px auto; width: 95%; max-width: 1400px; padding: 15px 30px; box-sizing: border-box;">
        <div class="nav-brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
            CosmosLib
        </div>
        <div class="nav-links">
            <a href="{% url 'index' %}">Home</a>
            <a href="{% url 'books' %}" class="active">Books</a>
        </div>
        <div class="topbar-right" style="display:flex; align-items:center; gap: 15px;">
        </div>
    </nav>

    <div class="details-wrapper">
        <h1 class="page-title">Book Overview</h1>

        <div class="container details-glass-card">
            <div class="cover-section">
                <img id="image" alt="Book Cover">
            </div>

            <div class="info-section">
                <h2 id="title" class="book-title-heading"></h2>

                <div class="meta-grid">
                    <div class="meta-item">
                        <span class="meta-label">Author</span>
                        <span class="meta-value" id="author"></span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Published</span>
                        <span class="meta-value" id="year"></span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Category</span>
                        <span class="meta-value badge" id="category"></span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Pages</span>
                        <span class="meta-value" id="pages"></span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Language</span>
                        <span class="meta-value" id="language"></span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Price</span>
                        <span class="meta-value text-success" id="price"></span>
                    </div>
                    <div class="meta-item">
                        <span class="meta-label">Status</span>
                        <span class="meta-value" id="status"></span>
                    </div>
                </div>

                <div class="description-block">
                    <p class="meta-label">Description</p>
                    <p id="description" class="description-text"></p>
                </div>

                <div class="action-block">
                    <button id="bookBtn" class="btn-borrow">Borrow Book</button>
                    <p id="message" class="status-message"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'js/details.js' %}"></script>
</body>

</html>
